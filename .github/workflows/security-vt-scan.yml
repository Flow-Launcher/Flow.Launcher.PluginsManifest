name: VirusTotal Scan

# Phase 2 of the two-phase PR scanning design (and also the scheduled/manual scan).
#
# For PR submissions: this workflow is triggered by workflow_run after the untrusted
# "VirusTotal PR Prepare" workflow (security-vt-pr-prepare.yml) completes successfully.
# It runs in the trusted base-repo context where VT_API_KEY is available.
#
# Security model:
#   - For workflow_run: the base repo is checked out (trusted code only).
#     The fork PR head is NEVER checked out here.
#   - Changed plugin manifest files are downloaded from the Workflow A artifact and
#     treated as untrusted data (read by trusted base-repo scripts).
#   - VT_API_KEY is only used in this trusted context, never exposed to fork PR code.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
  workflow_run:
    workflows: ["VirusTotal PR Prepare"]
    types: [completed]
  # For PRs that do NOT touch plugin manifests: this trigger fires (paths-ignore means
  # "run when the changed files are NOT all in plugins/*.json"), all jobs are skipped
  # (their conditions don't match pull_request), and the workflow completes as success.
  # This satisfies any branch-protection rule that requires this check to pass on every PR.
  # For manifest PRs the paths-ignore filter prevents this trigger from firing; only the
  # workflow_run path above handles those.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "plugins/*.json"

permissions:
  contents: read  # Restrict GITHUB_TOKEN

jobs:
  vt-plugin-scan:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # Needed to download artifacts from the triggering workflow_run
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        # Always checks out the base repository's default branch.
        # For workflow_run, this is trusted base-repo code only — the fork PR head
        # is never checked out here.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Avoid repeat downloads which bump the plugins' download count
      - name: Restore downloaded plugin cache
        uses: actions/cache/restore@v5
        # No need to restore cache for PR scans — plugin is downloaded and scanned fresh each time.
        # Plugin dev may repeatedly only update one version.
        if: github.event_name != 'workflow_run'
        with:
          path: |
            scan-files/
            plugin-download-cache.json
          key: plugin-zips-restore-not-used
          restore-keys: plugin-zips-

      - name: Download PR plugin manifests artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: pr-plugin-manifests
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr-manifests/

      - name: Copy PR manifests into plugins directory
        if: github.event_name == 'workflow_run'
        # The artifact manifests are untrusted data. Copying them into plugins/ lets the
        # existing --mode new logic detect them as new submissions (IDs absent from plugins.json).
        run: cp pr-manifests/*.json plugins/

      - name: Download plugin submitted in this PR
        if: github.event_name == 'workflow_run'
        # Trusted base-repo script; reads manifests from plugins/ as data only.
        run: python ci/src/download_plugins.py --mode new --output-dir scan-files

      - name: Download all plugins with cache metadata
        if: github.event_name != 'workflow_run'
        run: python ci/src/download_plugins.py --output-dir scan-files --cache-meta plugin-download-cache.json

      - name: Restore VirusTotal scan cache from previous runs
        uses: actions/cache/restore@v5
        # Don't use cache for PR scans — always retrieve a fresh report for new submissions.
        if: github.event_name != 'workflow_run'
        with:
          path: vt_cache.json
          key: vt-cache-restore-not-used
          restore-keys: vt-cache-

      - name: Run VirusTotal scan
        uses: jjw24/virustotal-scanner-action@v1.0.1
        with:
          api-key: ${{ secrets.VT_API_KEY }}
          scan-paths: |
            ./scan-files/
          no-cache: false
          cache-path: vt_cache.json
          whitelist-path: vt_whitelist.json
          report-path: vt_report.json
          request-interval-sec: 15
          analysis-poll-timeout-sec: 600
          download-timeout-sec: 120
          max-report-age-days: 30

      - name: Save VirusTotal scan cache for future runs
        uses: actions/cache/save@v5
        # Cache not used for PR plugin submissions
        if: always() && github.event_name != 'workflow_run'
        with:
          path: vt_cache.json
          key: vt-cache-${{ hashFiles('vt_cache.json') }}

      - name: Save plugin ZIPs and cache metadata for future runs
        uses: actions/cache/save@v5
        # Upload even if scan fails
        if: always() && github.event_name != 'workflow_run'
        with:
          path: |
            scan-files/
            plugin-download-cache.json
          key: plugin-zips-${{ hashFiles('plugin-download-cache.json') }}

      - name: Upload VirusTotal scan report as viewable artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: vt_report.json
          archive: false

      - name: Upload VirusTotal scan cache as viewable artifact
        uses: actions/upload-artifact@v7
        # Cache not used for PR plugin submissions
        if: always() && github.event_name != 'workflow_run'
        with:
          path: vt_cache.json
          archive: false

      - name: Upload plugin download cache metadata as viewable artifact
        uses: actions/upload-artifact@v7
        # Upload even if scan fails
        if: always() && github.event_name != 'workflow_run'
        with:
          path: plugin-download-cache.json
          archive: false
